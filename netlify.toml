# Netlify Configuration

# Build settings - Production (main branch → yorubaheritage.com)
[build]
  publish = "."
  command = "node build-content.js"

# Dev branch → preview URL only (content team's branch)
[context.dev]
  publish = "."
  command = "node build-content.js"

# Any branch deploy (fallback)
[context.branch-deploy]
  publish = "."
  command = "node build-content.js"

# Redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML — never cache (always fetch fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# JSON data files — never cache (content updates frequently)
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# JS — short cache, revalidate (1 hour)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# CSS — short cache, revalidate (1 hour)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Images — long cache is fine, they rarely change
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Custom 404 page (optional - create this file if needed)
# [[redirects]]
#   from = "/*"
#   to = "/404.html"
#   status = 404
