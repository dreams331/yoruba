backend:
  name: git-gateway
  branch: dev # Content team commits here — never directly to main

# Enable editorial workflow for content review
publish_mode: editorial_workflow

# Media files configuration
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Collections (content types)
collections:
  # Articles Collection
  - name: "articles"
    label: "Articles"
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["history", "culture", "people", "diaspora", "language"]}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Read Time", name: "readTime", widget: "string", default: "5 min"}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Video URL (YouTube/Vimeo)", name: "video_url", widget: "string", required: false, hint: "Optional — embeds a video on the article page"}

  # Stories Collection
  - name: "stories"
    label: "Traditional Stories"
    folder: "content/stories"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["folktales", "legends", "myths", "parables"]}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Read Time", name: "readTime", widget: "string", default: "5 min"}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Moral/Lesson", name: "moral", widget: "text", required: false}

  # IFA Wisdom Collection
  - name: "ifa"
    label: "IFA Wisdom"
    folder: "content/ifa"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["IFA Basics", "Odu IFA", "Orisha", "Practice", "Philosophy", "Contemporary"]}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Read Time", name: "readTime", widget: "string", default: "10 min"}
      - {label: "Body", name: "body", widget: "markdown"}

  # Gallery Collection
  - name: "gallery"
    label: "Gallery Images"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Category", name: "category", widget: "select", options: ["artifacts", "festivals", "architecture", "arts-crafts", "sacred-sites", "contemporary"]}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Date Taken", name: "date", widget: "datetime", required: false}
      - {label: "Location", name: "location", widget: "string", required: false}
      - {label: "Photographer/Credit", name: "credit", widget: "string", required: false}

  # Diaspora Countries Collection
  - name: "diaspora-countries"
    label: "Diaspora Countries"
    folder: "content/diaspora-countries"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Country Name", name: "title", widget: "string"}
      - {label: "Country Slug", name: "slug", widget: "string", hint: "URL-friendly name e.g. brazil, united-kingdom, trinidad-and-tobago"}
      - {label: "Flag Emoji", name: "flag", widget: "string", hint: "e.g. 🇧🇷"}
      - {label: "Region", name: "region", widget: "select", options: ["The Americas", "Caribbean", "Africa", "Europe", "Asia", "Oceania"]}
      - {label: "Estimated Population", name: "population", widget: "string", hint: "e.g. 1–2 million"}
      - {label: "Short Overview", name: "description", widget: "text"}
      - {label: "Tags", name: "tags", widget: "list", hint: "e.g. Candomblé, Cultural Centers"}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Full Country Content", name: "body", widget: "markdown", hint: "Add detailed content about Yoruba culture, history, religion and community in this country"}

  # Odu Ifa Collection (256 Odu — 16 Meji + 240 Omo Odu)
  - name: "odu-ifa"
    label: "Odu Ifa"
    folder: "content/odu-ifa"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title (Yoruba name)", name: "title", widget: "string", hint: "e.g. Èjì Ogbè, Ogbè-Ọ̀yẹ̀kú"}
      - {label: "Number (1-256)", name: "number", widget: "number"}
      - {label: "Category", name: "category", widget: "select", options: ["Odu Meji", "Omo Odu"]}
      - {label: "Slug", name: "slug", widget: "string", hint: "URL-friendly id, e.g. eji-ogbe"}
      - {label: "Parent Odu 1 (slug)", name: "parent1", widget: "string"}
      - {label: "Parent Odu 2 (slug)", name: "parent2", widget: "string"}
      - {label: "Associated Orisha", name: "orisha", widget: "string"}
      - {label: "Theme/Keywords", name: "theme", widget: "string"}
      - {label: "Proverb (Yoruba)", name: "proverb_yo", widget: "string", required: false}
      - {label: "Proverb (English)", name: "proverb_en", widget: "string", required: false}
      - {label: "Short Excerpt", name: "excerpt", widget: "text"}
      - {label: "Pattern — Right Leg", name: "pattern_right", widget: "string", hint: "Comma-separated I/II marks, e.g. I,I,I,I"}
      - {label: "Pattern — Left Leg", name: "pattern_left", widget: "string", hint: "Comma-separated I/II marks, e.g. I,I,I,I"}
      - {label: "Full Body", name: "body", widget: "markdown"}

  # Festivals & Events Collection (Àjọ̀dún Yorùbá)
  - name: "events"
    label: "Festivals & Events"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Event/Festival Name", name: "title", widget: "string", hint: "e.g. Ọ̀ṣun Ọ̀ṣogbo Festival, Ìṣẹ̀ṣe Day, Èyo Festival"}
      - {label: "Yoruba Name (optional)", name: "title_yo", widget: "string", required: false}
      - {label: "Event Type", name: "type", widget: "select", options: ["Religious/Spiritual", "Cultural Festival", "Commemoration", "Royal/Palace", "Diaspora Celebration", "Modern/Contemporary"]}
      - {label: "Location", name: "location", widget: "string", hint: "e.g. Osogbo, Nigeria or Bahia, Brazil"}
      - {label: "Country/Region", name: "region", widget: "select", options: ["Nigeria — Southwest", "Nigeria — Other", "Benin Republic", "Togo", "Brazil", "Cuba", "USA", "UK", "Other Diaspora"]}
      - {label: "When it Happens", name: "timing", widget: "string", hint: "e.g. August (2 weeks), Every August 20, Annually in Ogun state"}
      - {label: "Is this a Recurring Annual Event?", name: "recurring", widget: "boolean", default: true}
      - {label: "Approximate Date (this year/next occurrence)", name: "date", widget: "datetime", required: false}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Short Description", name: "excerpt", widget: "text"}
      - {label: "Full Details", name: "body", widget: "markdown"}
      - {label: "Associated Orisha/Deity", name: "orisha", widget: "string", required: false}
      - {label: "Official/Reference Link", name: "link", widget: "string", required: false}
      - {label: "Video URL (YouTube/Vimeo)", name: "video_url", widget: "string", required: false, hint: "Paste a YouTube or Vimeo link — it will be embedded automatically"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}

  # News Collection (Ìròyìn Yorùbá)
  - name: "news"
    label: "Ìròyìn (News)"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Headline", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["Culture & Heritage", "Royal/Palace News", "Diaspora Community", "Language & Education", "Religion & Ifa/Orisha", "Events & Festivals", "Notable People"]}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Short Summary", name: "excerpt", widget: "text", hint: "A brief fair-use summary — do not copy full articles"}
      - {label: "Editorial Note/Context", name: "body", widget: "markdown", required: false, hint: "Optional additional Yoruba-community context/commentary"}
      - {label: "Original Source Name", name: "source_name", widget: "string", hint: "e.g. Punch, BBC Yoruba, The Nation"}
      - {label: "Original Source Link", name: "source_link", widget: "string", hint: "Always link back and credit the original publisher"}
      - {label: "Video URL (YouTube/Vimeo)", name: "video_url", widget: "string", required: false}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}

  # Videos Collection (standalone video library — embeds only, no hosting)
  - name: "videos"
    label: "Videos"
    folder: "content/videos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["Festivals & Events", "Documentary", "Music & Dance", "Language Lessons", "Ifa & Orisha", "Interviews", "Diaspora", "Other"]}
      - {label: "Video URL (YouTube/Vimeo)", name: "video_url", widget: "string", hint: "Paste the full YouTube or Vimeo link"}
      - {label: "Thumbnail (optional override)", name: "image", widget: "image", required: false, hint: "Leave blank to auto-use YouTube thumbnail"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Credit / Original Creator", name: "credit", widget: "string", required: false, hint: "e.g. Channel name — always credit the original creator"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}

  # Pages Collection (for About, etc.)
  - name: "pages"
    label: "Pages"
    files:
      - label: "About Page"
        name: "about"
        file: "content/pages/about.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Mission Statement", name: "mission", widget: "markdown"}
          - {label: "Vision", name: "vision", widget: "markdown", required: false}
